<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>My Progress · HMENA Chess</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="preview-ribbon">STUDENT PORTAL · STAGING</div>
  <div class="shell student-shell">
    <nav class="topbar">
      <a class="brand" href="../"><span class="brand-mark">♞</span><span>HMENA Chess<small id="brand-sub">MY PROGRESS</small></span></a>
      <div class="inline-editor"><select id="locale-select" class="field"><option value="en">English</option><option value="es">Español</option></select><button id="logout" class="btn btn-secondary" hidden>Log out</button></div>
    </nav>
    <section id="login-panel" class="portal-login panel">
      <span class="eyebrow" id="login-eyebrow">Private access</span><h1 id="login-title">My Progress</h1><p id="login-help">Enter the username and code your coach gave you.</p>
      <form id="login-form" class="portal-login-form">
        <label><span id="username-label">Username</span><input class="field" name="loginName" autocomplete="username" required></label>
        <label><span id="code-label">Code</span><input class="field" name="accessCode" type="password" autocomplete="current-password" required></label>
        <button id="login-button" class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </section>
    <section id="portal" hidden><header class="coach-hero"><div><span class="eyebrow">HMENA Chess 0–2500</span><h1 id="welcome">My Progress</h1><p id="portal-subtitle">Classes, skills and ratings in one place.</p></div></header><div id="students" class="coach-stack"></div></section>
    <p id="portal-error" class="form-message"></p>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
